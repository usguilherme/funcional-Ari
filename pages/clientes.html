<div class="glass-panel" style="padding-bottom: 80px;">
    <div class="table-header" style="flex-wrap: wrap; gap: 10px;">
        <div class="search-box" style="flex: 1; min-width: 200px;">
            <i data-lucide="search"></i>
            <input type="text" id="busca-cliente" placeholder="Buscar por nome..." onkeyup="filtrarClientesDebounced()" class="search-input" style="width: 100%;">
        </div>
        <select id="clientes-filtro-profissional" class="modern-input" style="width:auto;" onchange="filtrarClientes()">
            <option value="">Todos os Instrutores</option>
        </select>
        <button onclick="abrirModalCliente()" class="btn-primary">+ Novo Aluno</button>
    </div>
    
    <div class="table-responsive" style="overflow-x: auto;">
        <table class="modern-table" style="min-width: 1050px;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome Completo</th>
                    <th>Sexo</th>
                    <th>Idade</th>
                    <th>Contato</th>
                    <th>E-mail</th>
                    <th>Objetivo Principal</th>
                    <th>Frequência</th>
                    <th>Tempo/Treino</th>
                    <th>Início</th>
                    <th>Vencimento</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-clientes"></tbody>
        </table>
    </div>
</div>
