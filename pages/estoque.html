<div class="glass-panel form-inline mb-15">
    <input type="hidden" id="id-produto-edicao">
    <div class="grid-2 mobile-stack" style="width: 100%;">
        <input type="text" id="prod-nome" placeholder="Nome do Produto" class="modern-input">
        
        <div style="display: flex; gap: 10px;">
            <input type="number" id="prod-qtd" placeholder="Qtd" class="modern-input" style="flex: 1;">
            <input type="number" id="prod-preco" placeholder="R$ Venda" class="modern-input" style="flex: 1;">
            <input type="number" id="prod-qtd-minima" placeholder="Qtd Mínima" class="modern-input" style="flex: 1;" title="Abaixo desse valor, alerta de estoque baixo">
        </div>
        
        <div class="action-buttons" style="width: 100%; display: flex; gap: 10px; margin-top: 10px;">
            <button onclick="salvarProdutoEstoque()" id="btn-salvar-produto" class="btn-primary full-width">Salvar</button>
            <button onclick="cancelarEdicaoProduto()" id="btn-cancelar-produto" class="btn-danger" style="display:none">✕</button>
        </div>
    </div>
</div>

<div class="glass-panel mt-15" id="card-estoque-baixo" style="display:none; border: 1px solid rgba(248,113,113,0.4);">
    <h3>⚠️ Estoque Baixo</h3>
    <div id="lista-estoque-baixo" class="simple-list mt-10"></div>
</div>

<div class="glass-panel" style="margin-bottom: 80px;">
    <h3><i data-lucide="package" style="width:16px"></i> Itens em Estoque</h3>
    <div class="table-responsive" style="overflow-x: auto;">
        <table class="modern-table" style="min-width: 500px;">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Preço Venda</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-estoque">
            </tbody>
        </table>
    </div>
</div>
