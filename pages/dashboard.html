<div class="dashboard-view">

    <!-- ============================================================
         TOOLBAR — título + segmented control + filtros
         ============================================================ -->
    <section class="dash-card dash-toolbar">
        <div class="dash-toolbar__lead">
            <span class="dash-eyebrow">Visão Geral</span>
            <h2 class="dash-toolbar__title">Desempenho</h2>
            <button id="btn-instalar-app" class="btn-instalar-app" hidden>
                <i data-lucide="download"></i> Instalar app
            </button>
        </div>

        <div class="dash-toolbar__controls">
            <div class="dash-segment" role="group" aria-label="Período rápido">
                <button type="button" class="dash-segment__btn"
                    onclick="setPeriodoGrafico('hoje'); this.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('is-active')); this.classList.add('is-active');">Hoje</button>
                <button type="button" class="dash-segment__btn is-active"
                    onclick="setPeriodoGrafico('7dias'); this.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('is-active')); this.classList.add('is-active');">7 dias</button>
            </div>

            <div class="dash-filters">
                <label class="dash-field">
                    <span class="dash-field__label">Instrutor</span>
                    <select id="dash-filtro-profissional" class="dash-input dash-input--select" onchange="atualizarKPIs(); atualizarGraficos();">
                        <option value="">Todos os Instrutores</option>
                    </select>
                </label>
                <label class="dash-field">
                    <span class="dash-field__label">Início</span>
                    <input type="date" id="dash-grafico-inicio" class="dash-input" onchange="atualizarGraficos()">
                </label>
                <label class="dash-field">
                    <span class="dash-field__label">Fim</span>
                    <input type="date" id="dash-grafico-fim" class="dash-input" onchange="atualizarGraficos()">
                </label>
            </div>
        </div>
    </section>

    <!-- ============================================================
         BENTO GRID
         ============================================================ -->
    <div class="dash-bento">

        <!-- Hero KPI: Faturamento (2x2) -->
        <article class="dash-card dash-kpi dash-kpi--hero">
            <div class="dash-kpi__top">
                <span class="dash-kpi__icon"><i data-lucide="trending-up"></i></span>
                <span class="dash-kpi__tag">Período</span>
            </div>
            <div class="dash-kpi__body">
                <span class="dash-kpi__label">Faturamento</span>
                <h3 class="dash-kpi__value dash-kpi__value--xl" id="dash-faturamento">R$ 0,00</h3>
            </div>
        </article>

        <!-- Agendamentos -->
        <article class="dash-card dash-kpi">
            <span class="dash-kpi__icon"><i data-lucide="calendar-check"></i></span>
            <div class="dash-kpi__body">
                <span class="dash-kpi__label">Agendamentos</span>
                <h3 class="dash-kpi__value" id="dash-atendimentos">0</h3>
            </div>
        </article>

        <!-- Retornos Pendentes -->
        <article class="dash-card dash-kpi">
            <span class="dash-kpi__icon dash-kpi__icon--warn"><i data-lucide="hourglass"></i></span>
            <div class="dash-kpi__body">
                <span class="dash-kpi__label">Retornos Pendentes</span>
                <h3 class="dash-kpi__value" id="dash-retornos">0</h3>
            </div>
        </article>

        <!-- Pontos Distribuídos (wide) -->
        <article class="dash-card dash-kpi dash-kpi--wide">
            <span class="dash-kpi__icon dash-kpi__icon--info"><i data-lucide="award"></i></span>
            <div class="dash-kpi__body">
                <span class="dash-kpi__label">Pontos Distribuídos</span>
                <h3 class="dash-kpi__value" id="dash-pontos">0</h3>
            </div>
        </article>

        <!-- Gráfico: Planos Mais Realizados -->
        <section class="dash-card dash-chart dash-chart--donut">
            <header class="dash-chart__head">
                <h4 class="dash-chart__title">Planos Mais Realizados</h4>
                <span class="dash-chart__hint">Top 5</span>
            </header>
            <div class="dash-chart__canvas"><canvas id="chartTopServicos"></canvas></div>
        </section>

        <!-- Gráfico: Faturamento no Período -->
        <section class="dash-card dash-chart dash-chart--area">
            <header class="dash-chart__head">
                <h4 class="dash-chart__title">Faturamento no Período</h4>
                <span class="dash-chart__hint">Evolução diária</span>
            </header>
            <div class="dash-chart__canvas"><canvas id="chartSemanal"></canvas></div>
        </section>

        <!-- Aniversariantes (exibido via JS) -->
        <section class="dash-card dash-list-card dash-list-card--birthday" id="card-aniversariantes" style="display:none;">
            <header class="dash-list-card__head">
                <h3 class="dash-list-card__title">
                    <span class="dash-kpi__icon dash-kpi__icon--gold"><i data-lucide="cake"></i></span>
                    Aniversariantes de Hoje
                </h3>
            </header>
            <div id="lista-aniversariantes-dashboard" class="dash-simple-list"></div>
        </section>

        <!-- Alunos para Retornar -->
        <section class="dash-card dash-list-card dash-list-card--full">
            <header class="dash-list-card__head">
                <h3 class="dash-list-card__title">
                    <span class="dash-kpi__icon"><i data-lucide="history"></i></span>
                    Alunos para Retornar
                </h3>
                <div class="dash-list-card__filter">
                    <input type="date" id="dash-filtro-data" class="dash-input" onchange="filtrarRetornosDashboard()" aria-label="Filtrar retornos por data">
                    <button type="button" class="dash-ghost-btn" onclick="limparFiltroRetorno()">Todos</button>
                </div>
            </header>
            <div id="lista-retornos-dashboard" class="dash-simple-list"></div>
        </section>

    </div>
</div>
