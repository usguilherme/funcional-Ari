<div class="glass-panel" style="min-height: 80vh; padding-bottom: 80px;">
    <div class="agenda-header-flex" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
        <div>
            <h3 class="text-gradient" style="margin: 0;">Agenda</h3>
            <div style="display: flex; align-items: center; gap: 10px; margin-top: 5px; flex-wrap: wrap;">
                <input type="date" id="agenda-date-input" class="modern-input" style="width: auto;" onchange="renderAgenda()">
                <span id="agenda-dia-semana" class="text-muted" style="font-size: 12px;"></span>
            </div>
        </div>
        <button onclick="abrirAba('novo_atendimento')" class="btn-primary">+ Novo</button>
    </div>
    <div class="mt-10">
        <select id="agenda-filtro-profissional" class="modern-input" onchange="renderAgenda()">
            <option value="">Todos os Instrutores</option>
        </select>
    </div>
    <div class="timeline-container mt-20" id="lista-agenda">
        </div>
</div>
