<div class="pdv-layout mobile-stack">
    <div class="pdv-left glass-panel">
        <div class="step-box">
            <h3 style="margin-bottom: 10px;">📅 Data do Atendimento</h3>
            <div class="form-group">
                <input type="date" id="pdv-data" class="modern-input" style="font-weight: bold; color: var(--primary);">
            </div>
        </div>

        <div class="step-box">
            <span class="step-num">1</span>
            <h3>Quem é o aluno?</h3>
            <div class="form-group">
                <select id="pdv-cliente" class="modern-input"></select>
                <button onclick="abrirModalCliente()" class="btn-icon" title="Cadastrar Novo"><i data-lucide="user-plus"></i></button>
            </div>
        </div>

        <div class="step-box">
            <span class="step-num">2</span>
            <h3>Quem atendeu?</h3>
            <div class="form-group">
                <select id="pdv-profissional" class="modern-input"></select>
            </div>
        </div>

        <div class="step-box">
            <span class="step-num">3</span>
            <h3>Qual plano/treino ele fez?</h3>
            <div class="form-group">
                <select id="pdv-servico" class="modern-input"></select>
                <button onclick="adicionarAoCarrinho()" class="btn-primary">Adicionar</button>
            </div>
        </div>

        <div class="divider"></div>

        <h3>Pós-Venda Inteligente</h3>
        <div class="grid-2 mobile-stack">
            <div>
                <label class="label-small">Retorno em (dias)</label>
                <input type="number" id="pdv-dias-retorno" class="modern-input" placeholder="Ex: 30" oninput="calcularDataRetorno()">
            </div>
            <div>
                <label class="label-small">Data Calculada</label>
                <input type="date" id="pdv-retorno" class="modern-input">
            </div>
        </div>
        <div class="mt-10">
            <label class="label-small">Observações</label>
            <input type="text" id="pdv-obs" class="modern-input" placeholder="Ex: Usou Coloração 7.1...">
        </div>
    </div>

    <div class="pdv-right glass-panel" style="margin-bottom: 80px;">
        <div class="ticket-header">
            <h3>Resumo</h3>
            <span class="badge" id="badge-status-pdv">Aberto</span>
        </div>
        <ul id="lista-carrinho" class="carrinho-list" style="max-height: 200px; overflow-y: auto;">
            <li class="empty-state">Selecione os planos...</li>
        </ul>
        
        <div class="checkout-area">
            <div class="total-display">
                <span>Total a Pagar</span>
                <h2 id="pdv-total">R$ 0,00</h2>
            </div>
            
            <label class="label-small">Forma de Pagamento</label>
            <select id="pdv-pagamento" class="modern-input mb-10" onchange="toggleTroco()">
                <option value="Dinheiro">💵 Dinheiro</option>
                <option value="Pix">💠 Pix</option>
                <option value="Cartão Crédito">💳 Crédito</option>
                <option value="Cartão Débito">💳 Débito</option>
            </select>

            <div id="area-troco" class="troco-box">
                <div class="flex-between">
                    <div style="flex:1; margin-right:10px">
                        <label class="label-small">Recebido</label>
                        <input type="number" id="pdv-valor-pago" class="modern-input compact" placeholder="0,00" oninput="calcularTroco()">
                    </div>
                    <div style="flex:1; text-align:right">
                        <label class="label-small">Troco</label>
                        <h3 id="pdv-troco-display" class="text-success">R$ 0,00</h3>
                    </div>
                </div>
            </div>

            <div id="area-pix" class="pix-box" style="display:none; text-align:center; margin-bottom:10px;">
                <div id="qrcode-container" style="background:white; padding:10px; border-radius:8px; display:inline-block; margin-bottom:5px;">
                    <canvas id="qr-pix"></canvas>
                </div>
                <input type="text" id="pix-copia-cola" class="modern-input" readonly onclick="this.select()" style="font-size:10px;">
                <button onclick="copiarPix()" class="btn-small bg-green full-width mt-10">Copiar Código Pix</button>
            </div>

            <button onclick="finalizarVenda()" id="btn-finalizar-pdv" class="btn-checkout">FINALIZAR</button>
        </div>
    </div>
</div>

<div id="modal-confirmar-preco" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center;">
    <div class="glass-panel" style="width:90%; max-width:400px; padding:25px; text-align:center; border: 1px solid var(--border);">
        <h3 style="margin-bottom:10px;">Confirmar Valor</h3>
        <p id="txt-modal-produto" style="color:var(--primary); font-weight:bold; font-size:1.1em; margin-bottom:5px;"></p>
        <p id="txt-modal-preco-original" style="opacity:0.8; margin-bottom:20px;"></p>

        <div id="etapa-pergunta-preco">
            <h4 style="margin-bottom:20px;">É o mesmo valor?</h4>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button class="btn-primary" onclick="confirmarPreco(true)" style="width:100px;">Sim</button>
                <button class="btn-danger" onclick="mostrarInputPreco()" style="width:100px;">Não</button>
            </div>
            <button class="btn-dark-danger" onclick="fecharModalPreco()" style="margin-top:15px; width:100%;">Cancelar</button>
        </div>

        <div id="etapa-novo-preco" style="display:none;">
            <label class="label-small" style="text-align:left; display:block;">Qual o novo valor?</label>
            <input type="number" id="input-novo-preco" class="modern-input" placeholder="0.00" step="0.01" style="margin-bottom:15px;">
            <div style="display:flex; gap:10px;">
                <button class="btn-primary" onclick="confirmarPreco(false)" style="flex:1;">Confirmar</button>
                <button class="btn-danger" onclick="fecharModalPreco()" style="flex:1;">Cancelar</button>
            </div>
        </div>
    </div>
</div>
