<div class="glass-panel" style="padding: 25px; margin-bottom: 40px;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
        <div>
            <h2 style="color: var(--primary); margin: 0;">🔄 Central de Atualização de Mensalidades</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin-top: 5px;">Gerencie e altere o status de pagamento dos alunos com apenas um clique.</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="busca-atualizacao" class="modern-input" placeholder="Pesquisar aluno..." oninput="filtrarTabelaAtualizacao()" style="width: 250px;" aria-label="Pesquisar aluno">
        </div>
    </div>

    <div class="table-responsive">
        <table class="modern-table" style="width: 100%;">
            <thead>
                <tr>
                    <th>Aluno</th>
                    <th>WhatsApp</th>
                    <th>Vencimento</th>
                    <th>Status Atual</th>
                    <th style="text-align: right;">Ações de Atualização</th>
                </tr>
            </thead>
            <tbody id="tabela-atualizacao-mensalidades">
                <tr><td colspan="5" style="text-align:center; padding:20px; opacity:0.5;">Carregando alunos...</td></tr>
            </tbody>
        </table>
    </div>
</div>
